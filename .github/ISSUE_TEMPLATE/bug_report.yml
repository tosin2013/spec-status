name: Bug report
description: spec status gives a wrong result, a confusing error, or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A wrong count, status, dependency state, or exit code **without a diagnostic** on a supported roadmap or tasks shape is the most serious kind of bug. Please say so below.

        **Security issues** (reads outside the project root, reads of sensitive files, terminal escapes reaching output) must not be filed here. Use private reporting as described in [SECURITY.md](https://github.com/tosin2013/spec-status/blob/main/SECURITY.md).

        Do not paste private roadmap content. A minimal made-up example that shows the problem is best.
  - type: textarea
    id: version
    attributes:
      label: "`spec version` output"
      description: Paste all five lines. The `label:` line shows whether this is a release, module (`go install`), or development build.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: The full command line, including flags such as `--root`, `--json`, `--fail-on`, and filters.
      placeholder: spec status --root . --json
      render: shell
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal input
      description: The smallest roadmap and/or tasks.md snippet that reproduces the problem, with file paths.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened, for example the expected counts, statuses, blockers, or exit code, and why.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: The output you got (text or JSON) and the exit code (`echo $?`).
      render: text
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Wrong count, status, dependency, or exit code, with no diagnostic
        - Wrong result, but a diagnostic warned about it
        - Valid input rejected (fatal error or false warning)
        - Crash or panic
        - Confusing message or documentation
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, for example linux/amd64 or darwin/arm64. Other platforms are unsupported, but reports are still welcome.
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Where did the roadmap or tasks file come from?
      description: For example, written by /speckit.roadmap.write (speckit-roadmap version?), generated by spec-kit (version?), or hand-edited.
